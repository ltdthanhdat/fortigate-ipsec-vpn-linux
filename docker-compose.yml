# Interactive because you type the emailed OTP. Pass the conn name from
# config/ipsec.conf; run one VPN at a time (shared host network and /etc/ipsec.otp):
#   docker compose run --rm vpn <conn>
services:
  vpn:
    build: .
    image: vpn
    network_mode: host
    cap_add: [NET_ADMIN]
    init: true
    stdin_open: true
    tty: true
    container_name: vpn   # fixed name -> a second VPN at the same time is refused
    volumes:
      - ./config/ipsec.conf:/etc/ipsec.conf:ro
      - ./config/ipsec.secrets:/etc/ipsec.secrets:ro
